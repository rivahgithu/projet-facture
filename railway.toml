[build]
builder = "NIXPACKS"

[deploy]
startCommand = "php artisan storage:link || true ; (php artisan migrate --force || echo 'Migration warning') ; php artisan config:cache ; php artisan route:cache ; php artisan view:cache ; php artisan serve --host=0.0.0.0 --port=$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
