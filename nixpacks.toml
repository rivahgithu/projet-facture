# Configuration Nixpacks pour Railway (Laravel 11/12 + Inertia/React)
[phases.setup]
nixPkgs = [
    "...",
    "nodejs_20",
    "php83Extensions.gd",
    "php83Extensions.mbstring",
    "php83Extensions.pdo_mysql",
    "php83Extensions.pdo_pgsql",
    "php83Extensions.zip"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci || npm install"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan storage:link || true ; (php artisan migrate --force || echo 'Migration warning') ; php artisan config:cache ; php artisan route:cache ; php artisan view:cache ; php artisan serve --host=0.0.0.0 --port=$PORT"
